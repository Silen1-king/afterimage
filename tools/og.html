<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>share card</title>
<!-- 分享图模板：tools/build-pages.mjs 用浏览器打开 og.html?id=<作品 id>，截成 1200×630 的 og/<id>.jpg -->
<style>
@font-face { font-family: "Afterimage Serif"; src: url(../assets/fonts/noto-serif-sc-600.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: "Afterimage Serif"; src: url(../assets/fonts/noto-serif-sc-400.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Space Grotesk"; src: url(../assets/fonts/space-grotesk-latin-300-normal.woff2) format("woff2"); font-weight: 300; }
@font-face { font-family: "JetBrains Mono"; src: url(../assets/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #050507; color: #ece8e1; }
body { position: relative; font-family: "Space Grotesk", sans-serif; -webkit-font-smoothing: antialiased; }
.mono { font-family: "JetBrains Mono", monospace; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; }
#glow { position: absolute; inset: 0; }
#dust { position: absolute; inset: 0; }
.grain { position: absolute; inset: 0; opacity: .1; mix-blend-mode: screen;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.scan { position: absolute; inset: 0; background: repeating-linear-gradient(transparent 0 3px, rgba(0,0,0,.16) 3px 4px); }

/* 右边：剧照 / 票根 */
.still { position: absolute; }
.still img { display: block; }
.still.frame { top: 0; right: 0; bottom: 0; width: 640px;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 34%); mask-image: linear-gradient(to right, transparent 0, #000 34%); }
.still.frame img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; filter: saturate(1.05) contrast(1.04); }
.still.ticket { right: 96px; top: 50%; height: 520px; transform: translateY(-50%) rotate(-4deg);
  box-shadow: 0 40px 80px -24px rgba(0,0,0,.85), 0 12px 30px -14px rgba(0,0,0,.7); border-radius: 6px; overflow: hidden; }
.still.ticket img { height: 100%; width: auto; }

/* 左边：文字 */
.text { position: absolute; left: 76px; top: 70px; bottom: 64px; width: 600px; display: flex; flex-direction: column; }
.kicker { display: flex; align-items: center; gap: 16px; opacity: .86; }
.kicker i { width: 34px; height: 1px; background: currentColor; opacity: .55; }
h1 { margin-top: 34px; font-family: "Afterimage Serif", serif; font-weight: 600; font-size: 84px; line-height: 1.12; letter-spacing: .05em;
  text-wrap: balance; text-shadow: 0 4px 40px rgba(0,0,0,.6); }
.en { margin-top: 14px; font-weight: 300; font-size: 28px; letter-spacing: .02em; opacity: .9; }
.line { margin-top: 34px; padding-left: 22px; border-left: 2px solid rgba(255,255,255,.55); font-family: "Afterimage Serif", serif; font-weight: 400; font-size: 32px; letter-spacing: .08em; }
.foot { margin-top: auto; display: flex; align-items: baseline; gap: 18px; }
.foot b { font-family: "Afterimage Serif", serif; font-weight: 600; font-size: 30px; letter-spacing: .14em; }
.foot .mono { opacity: .62; font-size: 13px; }
.badge { display: inline-flex; align-items: center; gap: 10px; margin-left: auto; padding: 8px 16px 7px; border: 1px solid rgba(255,255,255,.45); border-radius: 999px; font-size: 12px; }
.credit { position: absolute; right: 28px; bottom: 20px; font-size: 11px; letter-spacing: .08em; text-transform: none; opacity: .7; text-shadow: 0 1px 6px rgba(0,0,0,.9); }
.badge.zh { font-family: "Afterimage Serif", serif; font-size: 15px; letter-spacing: .18em; text-transform: none; }
</style>
</head>
<body>
<canvas id="glow" width="1200" height="630"></canvas>
<canvas id="dust" width="1200" height="630"></canvas>
<div class="still" id="still" hidden><img id="img" alt=""></div>
<div class="scan"></div>
<div class="grain"></div>
<p class="credit mono" id="credit" hidden></p>
<div class="text">
  <p class="kicker mono"><span id="no"></span><i></i><span id="type"></span><i></i><span id="year"></span></p>
  <h1 id="title"></h1>
  <p class="en" id="en"></p>
  <p class="line" id="line" hidden></p>
  <p class="foot"><b>残影</b><span class="mono">silen1.com/afterimage</span><span class="badge mono" id="badge" hidden></span></p>
</div>
<script type="module">
import { WORKS, TYPES } from '../data/works.js';
const id = new URLSearchParams(location.search).get('id');
const i = WORKS.findIndex((w) => w.id === id);
const w = WORKS[i];
const $ = (s) => document.querySelector(s);
// 固定种子的随机数：同一部作品每次画出来都一样
let seed = [...id].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const rnd = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const [c1, c2, c3] = w.palette;

$('#no').textContent = `NO.${String(i + 1).padStart(2, '0')}`;
$('#type').textContent = `${TYPES[w.type].zh} ${TYPES[w.type].en}`;
$('#year').textContent = w.year;
$('#title').textContent = w.title;
$('#en').textContent = w.title_en;
if (w.line) { $('#line').hidden = false; $('#line').textContent = w.line; }
if (w.still) {
  const b = $('#badge'); b.hidden = false; b.classList.add('zh');
  b.textContent = w.still.kind === 'ticket' ? '附票根' : '附定格';
  const s = $('#still'); s.hidden = false; s.classList.add(w.still.kind === 'ticket' ? 'ticket' : 'frame');
  $('#img').src = '../' + w.still.src;
  if (w.still.credit) { $('#credit').hidden = false; $('#credit').textContent = w.still.credit; }
}

// 背景：作品色谱的光晕
const g = $('#glow').getContext('2d');
g.fillStyle = c3; g.globalAlpha = .55; g.fillRect(0, 0, 1200, 630); g.globalAlpha = 1;
const blob = (x, y, r, c, a) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c); gr.addColorStop(1, 'transparent'); g.globalAlpha = a; g.fillStyle = gr; g.fillRect(0, 0, 1200, 630); };
blob(160, 640, 620, c1, .5);
blob(1040, 40, 560, c2, .42);
blob(760, 420, 380, c1, .22);
g.globalAlpha = 1;
const shade = g.createLinearGradient(0, 0, 760, 0); shade.addColorStop(0, 'rgba(5,5,7,.72)'); shade.addColorStop(1, 'rgba(5,5,7,0)');
g.fillStyle = shade; g.fillRect(0, 0, 1200, 630);

// 粒子：一条扭过去的光带，和网站里的一样
const d = $('#dust').getContext('2d');
d.globalCompositeOperation = 'lighter';
for (let k = 0; k < 2600; k++) {
  const u = rnd();
  const x = -80 + u * 1360;
  const strand = k % 2;
  const a = u * 7.2 + strand * Math.PI + (rnd() - .5) * .7;
  const y = 330 + Math.sin(u * 3.1 + .6) * 150 + Math.cos(a) * 92 + (rnd() - .5) * 18;
  const far = rnd() < .22;
  const px = far ? rnd() * 1200 : x, py = far ? rnd() * 630 : y;
  const size = (far ? .6 : 1) * (0.6 + rnd() * 1.9) * (1 + .6 * Math.sin(a) ** 2);
  const col = rnd() < .06 ? '#ffffff' : (rnd() < .62 ? c1 : c2);
  d.globalAlpha = (far ? .35 : .75) * (.4 + rnd() * .6);
  d.fillStyle = col;
  d.beginPath(); d.arc(px, py, size, 0, Math.PI * 2); d.fill();
}

await document.fonts.ready;
await Promise.all([...document.images].filter((im) => im.src).map((im) => im.decode().catch(() => {})));
document.body.dataset.ready = '1';
</script>
</body>
</html>
